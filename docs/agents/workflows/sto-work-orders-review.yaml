# Шаблон: контроль заказ-нарядов
# Cursor Automations → расписание каждые 4 часа в рабочее время

name: "CRM: контроль заказ-нарядов"
description: "Проверка статусов ЗН, запчастей и уведомлений клиентам"

workflow:
  triggers:
    - cron:
        cron: "0 9,13,17 * * 1-6"
  actions: []
  prompts:
    - |
      Ты — аналитик цеха СТО в CRM АвтоПлан.

      Прочитай AGENTS.md и код:
      - api/routes/deals.ts, src/pages/zn.tsx
      - api/lib/deal-totals.ts, api/lib/stock-reserve.ts
      - api/services/service-notify.ts

      Найди риски:
      - ЗН без позиций (работы/запчасти)
      - Долго на одной стадии канбана
      - Резерв склада vs остаток
      - Клиенту давно не отправляли статус

      Выдай:
      ## ЗН требуют внимания (id, клиент, проблема)
      ## Запчасти заказать / зарезервировать
      ## SMS/уведомления клиенту (текст-черновик)
      ## Задачи для приёмщика и мастера

      Русский язык, только actionable пункты.
  model: ""
  agentOptions:
    skipInstall: false
  memoryEnabled: true
