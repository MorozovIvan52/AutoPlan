name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify health module
        run: npx tsx -e "import { collectHealth } from './api/lib/ops-metrics.ts'; console.log((await collectHealth()).status)"

  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      CRM_DB_PATH: crm-e2e.db
      CRM_FORCE_SQLITE: "1"
      PORT: "4200"
      NODE_ENV: test
      AUTH_SALT: ci-test-salt-for-legacy-passwords
      E2E_LOGIN: ${{ secrets.E2E_LOGIN }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      TELEGRAM_POLLING_IN_APP: "false"
      AVITO_POLL_INTERVAL_SECONDS: "9999"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare E2E database
        run: |
          rm -f crm-e2e.db crm-e2e.db-wal crm-e2e.db-shm
          npx drizzle-kit push --force
          npm run setup:prod
          npm run e2e:user

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start server
        run: |
          npm run start &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4200/api/health && exit 0
            sleep 1
          done
          echo "Server did not start"
          exit 1

      - name: Run E2E tests
        run: npm run test:e2e:ci
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4200
          E2E_LOGIN: e2e@crm.local
          E2E_PASSWORD: E2eTest123!

      - name: Run billing E2E
        run: npm run test:e2e:billing
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4200
          E2E_LOGIN: e2e@crm.local
          E2E_PASSWORD: E2eTest123!

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: npm audit (high+ only)
        run: npm audit --audit-level=high
